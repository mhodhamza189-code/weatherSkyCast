<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#102a43" />
  <title>Weather Radar - Weather24</title>
  <link rel="stylesheet" href="style.css" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
</head>
<body class="radar-page">
  <div id="radarMap" aria-label="Interactive full-screen live precipitation radar map"></div>

  <header class="radar-topbar">
    <a class="radar-back" href="index.html" aria-label="Back to weather home">‹ Back</a>
    <h1 class="radar-page-title">Weather Radar</h1>
    <p class="radar-status" id="radarStatus" role="status">Loading radar...</p>
  </header>

  <section class="radar-bottom-panel" aria-label="Radar playback controls">
    <div class="radar-controls">
      <button id="radarPlay" type="button" disabled>Play</button>
      <input id="radarTimeline" type="range" min="0" max="0" value="0" aria-label="Radar timeline" disabled />
      <time id="radarTime">--:--</time>
    </div>
    <p class="radar-attribution">Radar tiles by <a href="https://www.rainviewer.com/" target="_blank" rel="noopener">API</a> · Map © OpenStreetMap</p>
  </section>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="script.js"></script>
</body>
</html>
